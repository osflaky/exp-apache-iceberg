name: "Hive CI"
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hive2-tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
        - jvm: 17
          event_name: '${{ github.event_name }}'
          os: macos-latest
          arch: x64
          runner: macos-15-intel
        - jvm: 21
          event_name: '${{ github.event_name }}'
          os: windows-latest
          arch: arm64
          runner: windows-11-arm
    env:
      SPARK_LOCAL_IP: localhost
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: zulu
        java-version: ${{ matrix.jvm }}
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        # Read-only: java-ci's build-checks (17) is the global canonical writer.
        cache-read-only: true
    - run: echo -e "$(ip addr show eth0 | grep "inet\b" | awk '{print $2}' | cut
        -d/ -f1)\t$(hostname -f) $(hostname -s)" | sudo tee -a /etc/hosts
    - run: ./gradlew -DsparkVersions= -DflinkVersions= -DkafkaVersions= 
        -Pquick=true :iceberg-mr:check -x javadoc
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: test logs
        path: |
          **/build/testlogs
